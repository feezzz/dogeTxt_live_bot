# PushPlus 微信推送 token
# 注册地址: https://www.pushplus.plus
# 登录后在一键推送页面获取你的token
pushplus_token: "YOUR_PUSPLUS_TOKEN_HERE"

# 监控的交易对
symbols:
  - ETHUSDT
  - BTCUSDT

# V3策略参数
strategy:
  score_threshold: 5.0        # 信号触发的最低分数（越高越严格，回测最优值）
  preview_threshold: 5.0      # 预览触发的最低分数（与正式阈值同级，关闭预览）
  min_atr_pct: 0.05           # 默认最低波动率过滤
  min_atr_pct_map:            # 分币种ATR阈值（BTC价高ATR%天然低）
    ETHUSDT: 0.05
    BTCUSDT: 0.03
  # 事件合约周期（仅10分钟，80%赔率）
  timeframes:
    10m:
      settle_bars: 2          # 2根5m K线 = 10分钟
      payout: 0.80            # 赔率 80%

# 连续亏损提醒（仅提醒，不暂停信号）
alerts:
  loss_streak_enabled: true
  loss_streak_thresholds: [3, 5]  # 连亏达到这些笔数时推送提醒

# 通知设置
notification:
  signal_enabled: true        # 是否推送信号
  summary_enabled: true       # 是否推送每日总结
  signal_cooldown_minutes: 5  # 同一symbol两次推送最小间隔（分钟）

# 飞书机器人推送（可选，留空则不启用）
# 飞书群 → 设置 → 群机器人 → 添加自定义机器人 → 复制 Webhook 地址
feishu_webhook_url: ""

# 代理设置（大陆服务器需开启，香港/海外服务器关闭）
proxy:
  enabled: true
  host: "127.0.0.1"
  port: 7892

# K线数据
data:
  cache_candles: 200          # 缓存最近N根5mK线
  ws_reconnect_delay: 5       # WS重连间隔（秒）
  rest_fallback_interval: 60  # REST轮询兜底间隔（秒）
