# PushPlus 微信推送 token
# 注册地址: https://www.pushplus.plus
# 登录后在一键推送页面获取你的token
pushplus_token: "YOUR_PUSHLUS_TOKEN_HERE"

# 监控的交易对
symbols:
  - ETHUSDT
  - BTCUSDT

# V3策略参数
strategy:
  score_threshold: 4.0        # 信号触发的最低分数（越高越严格）
  preview_threshold: 3.0     # 预览触发的最低分数（仅弹窗显示，不记录不推送）
  cooldown_candles: 2         # 冷却K线数（2根=10分钟）
  max_daily_trades: 50        # 每日最大信号数（10m+30m合计）
  min_atr_pct: 0.08           # 最低波动率过滤（ATR% < 此值不产生信号）
  # 事件合约周期
  timeframes:
    10m:
      settle_bars: 2          # 2根5m K线 = 10分钟
      payout: 0.80            # 赔率 80%
    30m:
      settle_bars: 6          # 6根5m K线 = 30分钟
      payout: 0.85            # 赔率 85%

# 风控参数
risk:
  daily_loss_limit: 75        # 单日亏损熔断（USD），基于固定$25/笔估算
  max_consecutive_loss: 3     # 连亏暂停数
  low_vol_hours: [22, 23, 0, 1, 2, 3, 4, 5]  # UTC低波动时段，此期间信号减半

# 通知设置
notification:
  signal_enabled: true        # 是否推送信号
  summary_enabled: true       # 是否推送每日总结（北京时间8:00）
  signal_cooldown_minutes: 5  # 同一symbol两次推送最小间隔（分钟）

# K线数据
data:
  cache_candles: 200          # 缓存最近N根5mK线
  ws_reconnect_delay: 5       # WS重连间隔（秒）
  rest_fallback_interval: 60  # REST轮询兜底间隔（秒）
