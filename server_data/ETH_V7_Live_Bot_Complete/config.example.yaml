# ETH V7.0 严格因果实时信号机器人
symbols:
  - ETHUSDT

# 海外服务器通常关闭；中国大陆网络无法直连 Binance 时再开启。
proxy:
  enabled: false
  host: 127.0.0.1
  port: 7892

# 留空则不推送，仅记录控制台与 CSV。
pushplus_token: ""
feishu_webhook_url: ""

notification:
  signal_enabled: true
  summary_enabled: true
  signal_cooldown_minutes: 0

alerts:
  loss_streak_enabled: true
  loss_streak_thresholds: [3, 5]

v7:
  model_dir: models/v7
  stake: 25.0
  payout: 0.80
  # 目前仅发送信号和影子结算，不自动下单。
  shadow_mode: true
